
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Minha Biblioteca</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logo">🦊 Minha Biblioteca</div>
    <nav class="menu">
      <a href="painel.html">Painel</a>
      <a href="livros.html">Livros</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="sobre.html">Sobre</a>
      <a href="cadastro.html" class="ativo">Cadastro</a>
      <a href="index.html" id="link-sair">Sair</a>
    </nav>
  </header>

  <main>
    <h1>Cadastro de usuário</h1>

    <section class="cartao">
      <form id="form-cadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <label for="tipo">Tipo de usuário</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecione o tipo</option>
          <option value="operador">Operador</option>
          <option value="administrador">Administrador</option>
        </select>

        <button type="submit" class="botao">Cadastrar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    Minha Biblioteca © 2026 | Feito por Alana Melo
  </footer>
</body>
</html>
